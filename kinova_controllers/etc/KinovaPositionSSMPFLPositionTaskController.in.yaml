# Set all regional force/stiffness parameters in the controller configuration.
# SSMPFL.Weight sets the weight of each link's safety PositionTask.
# Add the same SSMPFL.Regions entries used by KinovaPositionSSMPFLController.
Managed: true
PositionTask:
  Weight: 5.0
  Stiffness: 10.0
PostureTask:
  Weight: 0.1
  Stiffness: 1.0
SSMPFL:
  Weight: 5.0
  Stiffness: 2.0
  HumanMode: moving # use frozen only with SMPLH_FREEZE_FRAME set
